<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HAUS180 · Motion Lab</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh;cursor:pointer}canvas:focus-visible{outline:4px solid #FFC400;outline-offset:-5px}.ui{position:fixed;inset:0;pointer-events:none}.hint{position:absolute;bottom:7%;left:0;right:0;text-align:center;color:#3F5872;font-size:clamp(11px,1.2vw,14px);letter-spacing:.1em;transition:opacity .4s}.hint:after{content:'';display:block;width:32px;height:2px;margin:15px auto;background:#FFC400;animation:breathe 2s ease-in-out infinite}.final{position:absolute;top:12%;left:9%;right:9%;color:white;opacity:0;transform:translateY(22px);transition:opacity .6s,transform .6s}.final.show{opacity:1;transform:translateY(0)}.final h1{font-weight:300;font-size:clamp(2.1rem,6vw,5.6rem);line-height:1.1;letter-spacing:-.035em;margin:0}.rule{height:3px;background:#FFC400;width:0;max-width:250px;margin:24px 0;transition:width 1s .35s}.final.show .rule{width:32%}.signature{font-family:Impact,'Arial Narrow',sans-serif;font-size:clamp(28px,3.5vw,45px);letter-spacing:.04em}.signature span{color:#FFC400}.city{font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:8px}.restart{pointer-events:auto;position:absolute;right:8%;bottom:7%;color:white;background:transparent;border:0;border-bottom:2px solid #FFC400;padding:9px 0;font-size:14px;cursor:pointer;opacity:0;transition:opacity .4s}.restart.show{opacity:1}.skip{pointer-events:auto;position:absolute;top:25px;right:28px;border:0;background:transparent;color:#3F5872;font-size:12px;cursor:pointer}.skip.hidden{display:none}.status{position:absolute;left:25px;top:22px;color:#3F5872;font-size:11px;letter-spacing:.16em}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@keyframes breathe{50%{width:52px;opacity:.5}}@media(max-width:600px){.final{top:13%;left:7%;right:7%}.city{font-size:10px}.restart{bottom:8%}}@media(prefers-reduced-motion:reduce){.hint:after{animation:none}}
</style></head><body><canvas id="scene" tabindex="0" role="button" aria-label="Logotipo HAUS interactivo. Pulsa Enter o haz clic sobre las letras para entrar."></canvas><div class="ui"><div class="status" id="status">HAUS180 · MOTION LAB</div><button class="skip" id="skip">Omitir introducción ↗</button><div class="hint" id="hint">Pasa el cursor sobre el logotipo y haz clic para entrar</div><div class="final" id="final"><h1>Tu próximo capítulo<br>empieza aquí</h1><div class="rule"></div><div class="signature">HAUS<span>180</span></div><div class="city">Barranquilla y Puerto Colombia</div></div><button class="restart" id="restart">Volver a empezar ↗</button></div><div class="sr" aria-live="polite" id="announce"></div><script>
(()=>{
const svgPath = "M109 20H148V128H194V20H235V274H194V166H148V274H109Z M300 20H358L399 274H359L351 228H303L295 274H260Z M327 67L308 194H347Z M417 20H457V225Q457 241 477 241Q499 241 499 222V20H536V224Q536 277 477 277Q417 277 417 224Z M617 17Q676 17 676 73V90H639V76Q639 52 619 52Q598 52 598 75Q598 99 614 115L656 156Q676 176 676 207V224Q676 277 617 277Q557 277 557 220V196H594V217Q594 241 615 241Q637 241 637 219Q637 198 618 176L578 135Q558 113 558 82Q558 17 617 17Z";
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false}),hint=document.getElementById('hint'),final=document.getElementById('final'),restart=document.getElementById('restart'),skip=document.getElementById('skip'),announce=document.getElementById('announce');
const path=new Path2D(svgPath),files=['01-caribe.jpg','02-torre.jpg','03-barranquilla.jpg','04-muelle.jpg','05-costa.jpg','06-final.jpg'];let photos=files.map(()=>null);
// Fotografías de arquitectura ilustrativas mientras se reciben las fotos locales verificadas.
const demoPhotos=[
'https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=1400&q=80',
'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?w=1400&q=80',
'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1400&q=80',
'https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=1400&q=80',
'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1400&q=80',
'https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=1400&q=80'
];
files.forEach((file,i)=>{const load=(src,backup)=>{const img=new Image();img.onload=()=>photos[i]=img;img.onerror=()=>{if(backup)load(backup,null)};img.src=src};load('images/'+file,demoPhotos[i])});
let w=0,h=0,dpr=1,s=1,cx=0,cy=0,state='idle',t=0,last=performance.now(),start=performance.now(),click={x:400,y:150},maxZoom=110,reverseFrom=1,mouse={x:0,y:0,hover:false,px:0,py:0},cursor={x:0,y:0};const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=x=>{x=clamp(x,0,1);return x*x*x*(x*(x*6-15)+10)};
function size(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);s=Math.min(w*(w<650?.86:.70)/580,h*.45/270);cx=w/2;cy=h/2}window.addEventListener('resize',size);size();
function transformLogo(scale=1,origin=click){ctx.translate(cx+(origin.x-400)*s*(1-scale),cy+(origin.y-150)*s*(1-scale));ctx.scale(s*scale,s*scale);ctx.translate(-400,-150)}
function clipLogo(scale=1,origin=click){transformLogo(scale,origin);ctx.clip(path,'evenodd');ctx.setTransform(dpr,0,0,dpr,0,0)}
function paint(i,time,zoom=1,dx=0,dy=0){let im=photos[i];ctx.save();if(im&&im.naturalWidth){let factor=Math.max(w/im.naturalWidth,h/im.naturalHeight)*zoom,iw=im.naturalWidth*factor,ih=im.naturalHeight*factor;ctx.drawImage(im,(w-iw)/2+dx,(h-ih)/2+dy,iw,ih)}else{let palettes=[['#1a4764','#d09b68'],['#27465d','#8fadb9'],['#255674','#e3aa68'],['#285777','#d5a47a'],['#175371','#dbb37c'],['#112f47','#b37d52']];let colors=palettes[i%6],g=ctx.createLinearGradient(-w*.2+Math.sin(time*.16)*w*.25,0,w,h);g.addColorStop(0,colors[0]);g.addColorStop(.55,'#3F5872');g.addColorStop(1,colors[1]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.globalAlpha=.1;for(let k=0;k<8;k++){ctx.fillStyle=k%2?'white':'#102b40';ctx.fillRect(k*w/8+Math.sin(time*.4+k)*12,0,w*.045,h)}ctx.globalAlpha=1}ctx.fillStyle='rgba(19,45,68,.12)';ctx.fillRect(0,0,w,h);ctx.restore()}
function layer(i,time,alpha=1,z=1,dx=0,dy=0){ctx.save();ctx.globalAlpha=alpha;paint(i,time,z,dx,dy);ctx.restore()}
function drawIdle(time){
 // Ritmo visual electrónico: fotografía nueva cada 450 ms, corte suave de 90 ms.
 const interval=reduced?2.4:.45, transition=reduced?.5:.09;
 const phase=time/interval, k=Math.floor(phase)%6, fraction=phase-Math.floor(phase);
 const blend=ease(fraction/(transition/interval));
 const drift=1.08+.025*Math.sin(time*.8)+(mouse.hover?.07:0);
 layer((k+5)%6,time,1,drift,-cursor.x*16,-cursor.y*10);
 if(blend>0)layer(k,time,blend,1.18-.10*blend,-cursor.x*12,-cursor.y*8);
}
function hit(x,y){ctx.save();ctx.setTransform(1,0,0,1,0,0);const inside=ctx.isPointInPath(path,x,y,'evenodd');ctx.restore();return inside}
function coords(event){const r=canvas.getBoundingClientRect();return {x:(event.clientX-r.left-cx)/s+400,y:(event.clientY-r.top-cy)/s+150}}
function entryPoint(p){let best=null,bestScore=-1e9;for(let y=20;y<=275;y+=8)for(let x=110;x<=675;x+=8){if(!hit(x,y))continue;let margin=0;for(let radius=4;radius<=32;radius+=4){let good=true;for(let a=0;a<12;a++){let angle=a*Math.PI/6;if(!hit(x+radius*Math.cos(angle),y+radius*Math.sin(angle))){good=false;break}}if(!good)break;margin=radius}let score=margin*2.5-Math.hypot(x-p.x,y-p.y)*.45;if(score>bestScore){bestScore=score;best={x,y,margin}}}return best||{x:400,y:150,margin:12}}
function scaleFor(point){const dist=Math.max(...[[0,0],[w,0],[0,h],[w,h]].map(([x,y])=>Math.hypot(x-(cx+(point.x-400)*s),y-(cy+(point.y-150)*s))));return clamp(dist/(Math.max(point.margin,4)*s)*1.5,18,400)}
function announceState(next){state=next;start=performance.now();if(next==='enter'){hint.style.opacity='0';skip.classList.add('hidden');announce.textContent='Entrando a HAUS180'}if(next==='final'){final.classList.add('show');restart.classList.add('show');announce.textContent='Tu próximo capítulo empieza aquí'}if(next==='idle'){hint.style.opacity='1';final.classList.remove('show');restart.classList.remove('show');skip.classList.remove('hidden');announce.textContent='Animación reiniciada'}}
function enter(ev){if(state!=='idle')return;const p=ev?coords(ev):{x:400,y:150};if(ev&&!hit(p.x,p.y))return;click=entryPoint(p);maxZoom=scaleFor(click);announceState('enter')}
function rewind(){if(state==='idle')return;reverseFrom=state==='enter'?ease((performance.now()-start)/(reduced?.8:5.2)):1;final.classList.remove('show');restart.classList.remove('show');announceState('reverse')}
function draw(ts){let dt=Math.min((ts-last)/1000,.05);last=ts;if(state==='idle')t+=dt;let sec=(ts-start)/1000;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='white';ctx.fillRect(0,0,w,h);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';cursor.x+=(mouse.x-cursor.x)*.06;cursor.y+=(mouse.y-cursor.y)*.06;
if(state==='idle'){ctx.save();ctx.globalAlpha=ease((ts-initial)/(reduced?250:2000));clipLogo();drawIdle(t);ctx.restore();ctx.save();transformLogo();ctx.strokeStyle=mouse.hover?'#FFC400':'#3F5872';ctx.lineWidth=mouse.hover?2.7:1.1;ctx.stroke(path);ctx.restore();if(mouse.hover){ctx.save();clipLogo();let grad=ctx.createRadialGradient(mouse.px,mouse.py,2,mouse.px,mouse.py,w*.23);grad.addColorStop(0,'rgba(255,196,0,.3)');grad.addColorStop(1,'rgba(255,196,0,0)');ctx.globalCompositeOperation='screen';ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);ctx.restore()}}
else if(state==='enter'||state==='reverse'){let duration=state==='enter'?(reduced?.8:5.2):(reduced?.5:2.2),progress=state==='enter'?ease(sec/duration):reverseFrom*(1-ease(sec/duration)),zoom=Math.exp(Math.log(maxZoom)*progress);if(progress<.96){ctx.save();transformLogo(zoom*1.05);ctx.fillStyle='#FFC400';ctx.globalAlpha=(1-progress)*.7;ctx.fill(path,'evenodd');ctx.restore()}ctx.save();clipLogo(zoom);const k=Math.floor(t/(reduced?3:5.1))%6;layer(k,t,1,1.08+.12*progress);let a=ease((progress-.1)/.28),b=ease((progress-.44)/.30);if(a>0)layer((k+1)%5,t,a,1.45-.45*a);if(b>0)layer(5,t,b,1.45-.45*b);ctx.restore();if(progress>.94){ctx.save();ctx.globalAlpha=ease((progress-.94)/.06);layer(5,t);ctx.restore()}if(state==='enter'&&sec>=duration)announceState('final');if(state==='reverse'&&sec>=duration)announceState('idle')}
else if(state==='final'){layer(5,t)}
if(state==='final'){const shade=ctx.createLinearGradient(0,0,0,h);shade.addColorStop(0,'rgba(5,20,32,.65)');shade.addColorStop(.6,'rgba(5,20,32,.04)');shade.addColorStop(1,'rgba(5,20,32,.35)');ctx.fillStyle=shade;ctx.fillRect(0,0,w,h)}requestAnimationFrame(draw)}
let initial=performance.now();requestAnimationFrame(draw);
canvas.addEventListener('pointermove',e=>{const p=coords(e);mouse.hover=state==='idle'&&hit(p.x,p.y);mouse.px=e.clientX;mouse.py=e.clientY;mouse.x=(e.clientX/w-.5)*2;mouse.y=(e.clientY/h-.5)*2;canvas.style.cursor=mouse.hover?'pointer':'default'});canvas.addEventListener('pointerleave',()=>{mouse.hover=false;mouse.x=mouse.y=0});canvas.addEventListener('click',enter);canvas.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();enter()}if(e.key==='Escape')rewind()});restart.addEventListener('click',rewind);skip.addEventListener('click',()=>announceState('final'));addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'||e.key==='Escape')rewind()});
})();
</script></body></html>
